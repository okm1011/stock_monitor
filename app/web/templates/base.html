<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{% block title %}Stock Monitor{% endblock %}</title>
  <style>
    :root {
      --bg: #f2f4f6;
      --card: #fff;
      --text: #191f28;
      --sub: #8b95a1;
      --line: #e5e8eb;
      --blue: #3182f6;
      --blue-press: #1b64da;
      --green: #03b26c;
      --red: #f04452;
      --input: #f9fafb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 16px; padding-bottom: 48px; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    h1 { font-size: 1.35rem; margin: 0 0 4px; }
    h2 { font-size: 1.05rem; margin: 0 0 12px; }
    .sub { color: var(--sub); font-size: .9rem; margin-bottom: 16px; }
    label { display: block; font-size: .85rem; color: var(--sub); margin-bottom: 4px; }
    input[type=text], input[type=password], input[type=number], select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--input);
      font-size: 1rem;
      color: var(--text);
      margin-bottom: 12px;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
    .check {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 0; margin-bottom: 4px;
    }
    .check input { width: 20px; height: 20px; margin: 0; }
    .check label { margin: 0; color: var(--text); font-size: 1rem; }
    .btn {
      display: inline-block; width: 100%;
      border: 0; border-radius: 12px;
      padding: 14px 16px; font-size: 1rem; font-weight: 700;
      cursor: pointer; text-align: center; text-decoration: none;
    }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:active { background: var(--blue-press); }
    .btn-ghost { background: #eef1f4; color: var(--text); margin-top: 8px; }
    .btn-danger { background: #ffe8ea; color: var(--red); margin-top: 8px; }
    .flash { padding: 12px 14px; border-radius: 12px; margin-bottom: 12px; font-size: .95rem; }
    .flash.ok { background: #e8f8f0; color: #0a7a45; }
    .flash.err { background: #ffe8ea; color: var(--red); }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
    .pill {
      display: inline-block; padding: 4px 10px; border-radius: 999px;
      font-size: .8rem; background: #e8f3ff; color: var(--blue);
    }
    .pill.off { background: #eee; color: var(--sub); }
    .actions { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 30%); padding-top: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    {% block body %}{% endblock %}
  </div>
</body>
</html>
