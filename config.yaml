# stock-monitor config
# timeframe: 1m | 3m | 5m | 15m | 30m | 1h | 4h | 1d
# 알람은 signal_on_closed_bar=true 일 때 봉 마감 기준

# --- 감시 유니버스 (바이낸스) ---
# 바이낸스에는 일반 주식/ETF가 거의 없고, 현물 USDT 코인 페어가 대상입니다.
# 최근 N일 거래대금 상위 top_percentile% 를 매일 갱신해 4가지 규칙을 적용합니다.
# include_static_stocks=true 이면 아래 us/kr 고정 종목도 함께 감시합니다.
universe:
  enabled: true
  source: binance_spot
  quote_asset: USDT
  volume_lookback_days: 7
  top_percentile: 30        # 부하 크면 15 로 낮추세요
  max_symbols: 60           # EC2 t3.micro 안전 상한 (필요시 조절)
  refresh_hours: 24
  exclude_leveraged: true
  exclude_stablecoins: true
  include_static_stocks: true

# universe 모드에서는 crypto는 비워 두고, 주식/ETF는 binance_futures로 추가 (Yahoo 불필요)
crypto: []
kr_stocks: []
us_stocks:
  - ticker: SKHY
    name: SK Hynix ADR
    binance_futures: SKHYUSDT
  - ticker: SPCX
    name: SpaceX
    binance_futures: SPCXUSDT
  - ticker: SOXL
    name: SOXL Semiconductor Bull 3X
    binance_futures: SOXLUSDT
  - ticker: CRWV
    name: CoreWeave
    binance_futures: CRWVUSDT
  - ticker: SNDK
    name: SanDisk
    binance_futures: SNDKUSDT

poll_interval_seconds: 5.0
timeframe: 4h
signal_on_closed_bar: true

rsi:
  period: 7

macd:
  fast: 12
  slow: 26
  signal: 9

bollinger:
  period: 20
  stddev: 2.0

atr:
  period: 14
  sl_mult: 1.5
  tp_mult: 3.0

# 알람 규칙 on/off: enabled true/false
# 1) extreme_rsi     — RSI 과매수/과매도
# 2) rsi_macd_cross  — RSI 이탈 + MACD 크로스
# 3) divergence      — 상/하강 다이버전스
# 4) bb_squeeze      — 볼린저 스퀴즈 밴드
# 5) volume_spike — 잡코인 펌프 초입 (형성중봉·가격급등∧거래량∧횡보∧메이저제외)
rules:
  extreme_rsi:
    enabled: true
    high: 80.0
    low: 23.0
  rsi_macd_cross:
    enabled: false
    oversold: 30.0
    overbought: 70.0
  divergence:
    enabled: false
    oversold: 30.0
    overbought: 70.0
    lookback: 60
    pivot_left: 3
    pivot_right: 3
    use_rsi: true
    use_macd: true
  bb_squeeze:
    enabled: false
    squeeze_ratio: 0.05
  volume_spike:
    enabled: true
    timeframe: 3m
    window_bars: 5          # 최근 15분 가격
    min_price_pct: 15       # +15% 이상
    volume_lookback: 20
    volume_mult: 4.0        # 최신봉 거래량 ≥ 평균×4
    quiet_bars: 40          # 직전 ~2시간 횡보
    quiet_range_pct: 10     # 그 구간 고저 < 10%
    poll_seconds: 30          # 형성중 봉 감시 주기
    cooldown_seconds: 600   # 심볼당 10분
    max_workers: 15
    symbol_refresh_hours: 24
    exclude_bases:
      - BTC
      - ETH
      - BNB
      - SOL
      - XRP
      - DOGE
      - ADA
      - AVAX
      - LINK
      - DOT
      - TRX
      - LTC
      - BCH
      - NEAR
      - SUI
      - PEPE
      - WLD
      - UNI
      - AAVE
      - FIL
      - TON
      - SHIB
      - APT
      - ARB
      - OP
      - ATOM
      - ICP
      - HYPE

alert_cooldown_seconds: 300
history:
  max_candles: 300
  db_path: data/candles.db
status_log_seconds: 15.0
