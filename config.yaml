# stock-monitor config (웹 설정 페이지에서 저장하면 이 파일이 다시 쓰입니다)
# 타임프레임: tf_4h=4시간봉, tf_1d=일봉, tf_1w=주봉, tf_1mo=월봉
# 알람 1 rsi_alert: RSI 과매수 상향 돌파 / 과매도 하향 돌파 (형성 중 봉, 봉당 1회)
# 알람 2 ma_alert: ma50 / ma200 / ma100 (type: ema=EMA, sma=MA, vwma=VWMA) 위·아래에서 근접% 이내 진입 (형성 중 봉, 봉당 1회)
poll_seconds: 60.0
status_log_seconds: 600.0
universe:
  enabled: true
  top_n: 100
  include_tradfi: true
  refresh_hours: 24.0
  exclude_bases:
  - USDC
  - FDUSD
  - TUSD
  - BUSD
  - USDP
  - DAI
  - USDE
  - USD1
  - PYUSD
  - BFUSD
  - XUSD
macro:
  enabled: true
  poll_seconds: 300.0
  assets:
  - ticker: NQ=F
    name: 나스닥100 선물
  - ticker: ES=F
    name: S&P500 선물
  - ticker: RTY=F
    name: 러셀2000 선물
  - ticker: SOXX
    name: SOXX 반도체 ETF
  - ticker: GC=F
    name: 금 선물
  - ticker: SI=F
    name: 은 선물
  - ticker: PL=F
    name: 백금 선물
  - ticker: HG=F
    name: 구리 선물
  - ticker: CL=F
    name: WTI 원유
  - ticker: BZ=F
    name: 브렌트유
  - ticker: NG=F
    name: 천연가스
  - ticker: DX-Y.NYB
    name: 달러인덱스
  - ticker: ^TNX
    name: 미 10년물 금리
  - ticker: TLT
    name: TLT 미 장기채 ETF
  - ticker: ^VIX
    name: VIX
  - ticker: JPY=X
    name: 달러/엔
  - ticker: KRW=X
    name: 달러/원
  - ticker: ^KS11
    name: 코스피
  - ticker: ^N225
    name: 니케이225
  - ticker: ^HSI
    name: 항셍
rsi_alert:
  enabled: true
  period: 14
  rearm_gap: 5.0
  tf_4h:
    enabled: true
    overbought_enabled: true
    overbought: 75.0
    oversold_enabled: true
    oversold: 25.0
  tf_1d:
    enabled: true
    overbought_enabled: true
    overbought: 70.0
    oversold_enabled: true
    oversold: 30.0
  tf_1w:
    enabled: true
    overbought_enabled: true
    overbought: 70.0
    oversold_enabled: true
    oversold: 30.0
  tf_1mo:
    enabled: true
    overbought_enabled: true
    overbought: 70.0
    oversold_enabled: true
    oversold: 30.0
ma_alert:
  enabled: true
  rearm_mult: 3.0
  ma50:
    enabled: true
    type: ema
    tf_4h:
      enabled: true
      proximity_pct: 1.0
      from_above: true
      from_below: true
    tf_1d:
      enabled: true
      proximity_pct: 1.5
      from_above: true
      from_below: true
    tf_1w:
      enabled: true
      proximity_pct: 3.0
      from_above: true
      from_below: true
    tf_1mo:
      enabled: true
      proximity_pct: 5.0
      from_above: true
      from_below: true
  ma200:
    enabled: true
    type: ema
    tf_4h:
      enabled: true
      proximity_pct: 1.0
      from_above: true
      from_below: true
    tf_1d:
      enabled: true
      proximity_pct: 1.5
      from_above: true
      from_below: true
    tf_1w:
      enabled: true
      proximity_pct: 3.0
      from_above: true
      from_below: true
    tf_1mo:
      enabled: true
      proximity_pct: 5.0
      from_above: true
      from_below: true
  ma100:
    enabled: true
    type: vwma
    tf_4h:
      enabled: true
      proximity_pct: 1.0
      from_above: true
      from_below: true
    tf_1d:
      enabled: true
      proximity_pct: 1.5
      from_above: true
      from_below: true
    tf_1w:
      enabled: true
      proximity_pct: 3.0
      from_above: true
      from_below: true
    tf_1mo:
      enabled: true
      proximity_pct: 5.0
      from_above: true
      from_below: true
